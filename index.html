<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ダンジョンコレクター</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1c2c">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* VOICE: 手のひらサイズの冒険。ドット絵の温かみ、軽快。
   IDEA: 携帯ゲーム機。上が画面、下が十字キーとボタン。
   PICTURE: 16x16ドットのスプライトとタイルで描く緑の迷宮。
   COLOUR and TYPE: レトロ16色パレット1本に統一。主役は苔の緑、攻撃は赤、スキルは青、アイテムは金。DotGothic16。
   LAYOUT: 縦長スマホ。HUD / 画面 / ログ / 操作部。右手側に攻撃・スキル・アイテムを集約。 */
:root{color-scheme:dark;--bg:#1a1c2c;--panel:#333c57;--deep:#262b44;--ink:#f4f4f4;--dim:#94b0c2;--leaf:#38b764;--lime:#a7f070;--red:#b13e53;--org:#ef7d57;--gold:#ffcd75;--blue:#3b5dc9;--sky:#41a6f6;--navy:#29366f;--slate:#566c86}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DotGothic16",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.px{border:3px solid #0f1018;border-radius:6px;box-shadow:inset 0 -4px 0 #0005,inset 0 3px 0 #fff3}
.px:active{transform:translateY(2px);box-shadow:inset 0 3px 0 #0005}
.px:disabled{opacity:.45;transform:none}
.scr{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.scr.on{display:flex}
.wrap{width:100%;max-width:520px;margin:0 auto;padding:16px;overflow-y:auto;flex:1}
/* ホーム */
.logo{font-size:34px;line-height:1.05;margin:12px 0 4px;color:var(--lime);text-shadow:3px 3px 0 #0f1018}
.sub{color:var(--dim);font-size:13px}
.pcard{display:flex;gap:14px;align-items:center;background:var(--panel);border:3px solid #0f1018;border-radius:8px;padding:12px;margin:16px 0}
.pcard canvas{width:72px;height:72px;background:#2e4b3b;border:3px solid #0f1018;border-radius:6px;flex:none;image-rendering:pixelated}
.pcard b{font-size:19px;font-weight:400}
.pcard .row{display:flex;gap:12px;color:var(--dim);font-size:13px;flex-wrap:wrap}
.gate{width:100%;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;background:var(--leaf);color:#0f1018;padding:14px}
.gate svg{width:96px;height:96px}
.gate strong{display:block;font-size:34px;font-weight:400;line-height:1.05}
.gate span{font-size:14px}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.menu button{background:var(--panel);padding:12px;min-height:60px;display:flex;gap:10px;align-items:center;font-size:17px}
.menu svg{width:28px;height:28px;flex:none}
.note{color:var(--dim);font-size:13px;margin-top:18px}
/* ダンジョン選択 */
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:520px;margin:0 auto;width:100%}
.back{background:var(--panel);min-width:44px;min-height:44px;padding:0 12px}
.bar h2{font-size:22px;font-weight:400;margin:0}
.dcard{background:var(--panel);border:3px solid #0f1018;border-radius:8px;padding:14px;margin-bottom:12px;display:grid;gap:10px}
.dcard.lock{opacity:.5}
.dcard h3{margin:0;font-size:21px;font-weight:400}
.dcard p{margin:0;color:var(--dim);font-size:13px}
.dcard button{min-height:52px;background:var(--leaf);color:#0f1018;font-size:18px}
/* ゲーム */
#game{background:#0b0f14}
.hud{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel);border-bottom:3px solid #0f1018}
.hud .fl{font-size:15px;line-height:1.15;white-space:nowrap;background:var(--deep);padding:4px 8px;text-align:left;min-height:44px}
.hud .fl small{font-size:12px;color:var(--dim)}
.hud .fl.up{background:var(--gold);color:#0f1018}.hud .fl.up small{color:#0f1018}
.tag{display:inline-block;font-size:11px;padding:0 4px;border-radius:3px;margin-left:4px;background:#5d275d;color:#f4f4f4}
.rar{font-size:12px;margin-left:6px}
.eqc{background:#0f1018;border-radius:6px;padding:10px;margin:8px 0}
.eqc b{font-weight:400;font-size:17px;display:block}
.eqc p{margin:2px 0;font-size:13px;color:var(--dim)}
.eqc .u{color:var(--gold)}.eqc .ab{color:var(--sky)}
.eqc .lbl{font-size:12px;color:var(--slate)}
.st{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px 8px;align-items:center;margin-top:8px}
.st button{min-width:44px;min-height:44px;background:var(--deep);font-size:18px}
.st .v{min-width:64px;text-align:right}
.st .pl{color:var(--lime)}
.xpb{height:10px;background:#0f1018;border-radius:3px;overflow:hidden;margin:4px 0 10px}.xpb i{display:block;height:100%;background:var(--lime)}
.si .bt{display:flex;gap:6px}
.si .bt .ds{background:var(--deep);color:var(--dim);min-width:56px}
.col{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-bottom:2px solid var(--deep);padding:6px 0}
.col button{min-height:44px;min-width:72px;background:var(--leaf);color:#0f1018}
.bars{flex:1;display:grid;gap:4px}
.bars .r{display:flex;align-items:center;gap:8px}
.bars span{font-size:13px;line-height:1;white-space:nowrap;min-width:70px;text-align:right}
.gauge{flex:1;height:12px;background:#0f1018;border:2px solid #0f1018;border-radius:3px;overflow:hidden}
.gauge i{display:block;height:100%;transition:width .2s}
#hpi{background:linear-gradient(#ef7d57 0 40%,#b13e53 40%)}
#mpi{background:linear-gradient(#73eff7 0 40%,#41a6f6 40%)}
.hud .px{background:var(--deep);min-height:40px;padding:0 10px;font-size:14px}
.view{position:relative;flex:1;overflow:hidden}
.view canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.mini{position:absolute;top:8px;right:8px;width:104px;height:104px;padding:3px;background:#0f1018cc;border:2px solid #566c86;border-radius:6px;cursor:pointer}
.mini canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.mini:active{border-color:var(--gold)}
.arw{text-align:center;color:var(--gold);font-size:24px;line-height:1;margin:-2px 0}
.eqc.new{outline:2px solid var(--gold)}
.up{color:var(--lime)}.dn{color:var(--org)}.eq{color:var(--slate)}
.lg{font-size:13px}.lg i{display:inline-block;width:10px;height:10px;margin:0 4px 0 8px;border:1px solid #0f1018}.lg i:first-child{margin-left:0}
.sh3{margin:16px 0 6px;font-size:20px;font-weight:400;color:var(--lime)}.sh3:first-child{margin-top:4px}
#subc .eqc{background:#0f1018}
#subc .sl{margin:0;flex:none}
#subc .si{grid-template-columns:minmax(0,1fr)}
#subc .si .bt{justify-content:flex-end}
#subc .si .bt button{min-width:52px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}.tbl td{padding:7px 0;border-bottom:2px solid var(--deep)}.tbl td:last-child{text-align:right}
#bossbar{position:absolute;left:10px;right:10px;bottom:10px;background:#0f1018d9;border:2px solid #b13e53;border-radius:6px;padding:4px 8px;display:grid;gap:3px;font-size:13px}
#bossbar[hidden]{display:none}#bbi{background:linear-gradient(#ff5a5a 0 40%,#b13e53 40%)}
.unl{text-align:center;background:#0f1018;border-radius:6px;padding:12px;margin:8px 0}.unl svg{width:96px;height:96px}.unl p{color:var(--gold)!important;font-size:17px}
.dcard .tst{background:#5d275d;color:#f4f4f4;font-size:16px}
.vol{display:grid;grid-template-columns:64px 44px minmax(0,1fr) 40px 44px;gap:8px;align-items:center;margin:6px 0}
.vol button{min-height:44px;background:var(--deep);font-size:18px}.vol b{font-weight:400;text-align:center;font-size:14px}
.vb{height:12px;background:#0f1018;border-radius:3px;overflow:hidden}.vb i{display:block;height:100%;background:var(--sky)}
.cpv{text-align:center;background:#0f1018;border-radius:6px;padding:14px;margin-bottom:12px}.cpv canvas{width:256px;height:64px;image-rendering:pixelated;display:block;margin:0 auto 6px}.cpv b{font-weight:400;font-size:20px;color:var(--gold)}.cpv p{margin:2px 0 0;font-size:13px;color:var(--dim)}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cc{background:var(--panel);display:grid;justify-items:center;gap:2px;padding:8px 4px}.cc img{width:48px;height:48px;image-rendering:pixelated}.cc span{font-size:14px}.cc small{font-size:11px;color:var(--dim);white-space:nowrap}
.cc.on{background:var(--leaf);color:#0f1018}.cc.on small{color:#0f1018}
.nm{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}.nm span{font-size:14px;color:var(--dim)}
.nm input{font:inherit;font-size:16px;min-height:44px;padding:0 10px;border:3px solid #0f1018;border-radius:6px;background:#0f1018;color:var(--ink)}.nm input:focus{outline:3px solid var(--gold)}
.nm button{min-height:44px;padding:0 14px;background:var(--leaf);color:#0f1018}
#home .wrap{display:flex;flex-direction:column;overflow:hidden;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.scene{position:relative;margin:-16px -16px 10px;flex:1 1 0;min-height:140px;overflow:hidden;background:#141826}
.scene #hsvg,.scene #hsvg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#hchar{position:absolute;left:50%;bottom:2%;height:56%;max-height:150px;aspect-ratio:1;transform:translateX(-50%);image-rendering:pixelated}
.scene .ttl{position:absolute;top:14px;left:16px}
.scene::before{content:'';position:absolute;inset:0 0 auto 0;height:42%;background:linear-gradient(#0f1018e6,#0f101800);z-index:1;pointer-events:none}
.scene .ttl{z-index:2}
.scene .logo{margin:0;font-size:32px;color:#a7f070;text-shadow:3px 0 0 #0f1018,-3px 0 0 #0f1018,0 3px 0 #0f1018,0 -3px 0 #0f1018,3px 3px 0 #0f1018,-3px 3px 0 #0f1018,3px -3px 0 #0f1018,-3px -3px 0 #0f1018,0 5px 0 #0f1018}
.scene .sub{font-size:12px;color:#f4f4f4;text-shadow:2px 0 0 #0f1018,-2px 0 0 #0f1018,0 2px 0 #0f1018,0 -2px 0 #0f1018}
.dname{position:absolute;right:10px;bottom:8px;font-size:12px;color:#f4f4f4;background:#0f1018b3;border-radius:4px;padding:2px 8px}
#pcard{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;width:100%;text-align:left;color:inherit;margin:0 0 12px;background:var(--panel)}
#pcard .chev{color:var(--dim);font-size:14px}
.gate{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;min-height:76px;padding:8px}
.gate strong{font-size:30px}
.menu.signs{flex:none;margin-top:10px;gap:8px}
.menu.signs .sign{background:#8a5a2c;box-shadow:inset 0 -4px 0 #5d3a1a,inset 0 3px 0 #b08a5a;min-height:58px;padding:8px 12px;text-align:left}
.menu.signs .sign:active{box-shadow:inset 0 3px 0 #5d3a1a}
.sign .lb{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.sign .lb span{font-size:16px;color:#f4e4c8}
.sign .lb small{font-size:11px;color:#e6d3a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-height:700px){#pcard{padding:8px 12px;margin-bottom:8px}#pcard .row{font-size:12px}.gate{min-height:60px}.gate strong{font-size:24px}.menu.signs .sign{min-height:48px;padding:4px 10px}.menu.signs svg{width:22px;height:22px}.scene .logo{font-size:26px}}
.eqh{display:flex;align-items:center;gap:10px}
.eqi{width:44px;height:44px;flex:none;image-rendering:pixelated;background:#262b44;border-radius:4px}
.tabs.eqtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs.eqtabs button{min-height:48px;font-size:16px}
.col .cb .dis{background:var(--deep);color:var(--dim)}
.sg{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:#0f1018;border-radius:6px;padding:8px 10px;margin:6px 0;border:2px solid var(--gold)}
.sg.off{border-color:transparent;opacity:.6}.sg .sgn{display:flex;flex-direction:column;min-width:0}.sg b{font-weight:400}.sg small{font-size:12px;color:var(--dim)}
.sg button{min-height:44px;min-width:72px;background:var(--gold);color:#0f1018}
.bk2{display:grid;gap:8px;margin:8px 0}.bk2 button{min-height:48px;background:var(--deep)}
.bkt{width:100%;height:140px;font:13px/1.4 monospace;background:#0f1018;color:var(--ink);border:3px solid #0f1018;border-radius:6px;padding:8px;word-break:break-all}
#pcard .chev{text-align:center;font-size:12px;line-height:1.3}
.lock{background:#5d275d;color:#f4f4f4;border-radius:6px;padding:10px 12px;font-size:14px;margin:0 0 10px}
.gate.resume{background:var(--gold)}.gate.resume strong,.gate.resume span{color:#0f1018}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

.cb{display:grid;gap:6px}
.col .cb button{min-height:44px;min-width:72px}
.col .syn{background:var(--gold);color:#0f1018}
.pickm{display:block;width:100%;text-align:left;background:none;border:0;padding:0;color:inherit}
.pickm{background:#0f1018!important;border:2px solid #0f1018!important;border-radius:6px;padding:8px 10px!important;margin:6px 0;display:grid!important;gap:2px;min-height:44px}.pickm b{font-weight:400}.pickm span{font-size:13px;color:var(--sky)}.pickm.on{border-color:var(--sky)!important}
.lbl{font-size:12px;color:var(--slate)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tabs button{background:var(--deep);min-height:40px;padding:0 10px;font-size:14px}
.tabs button.on{background:var(--leaf);color:#0f1018}
.bk{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:2px solid var(--deep)}
.bk b{font-weight:400}.bk p{margin:0;font-size:13px}.bk .u{color:var(--gold)}
.ic{width:48px;height:48px;image-rendering:pixelated;background:#0f1018;border-radius:4px}
.ac{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:2px solid var(--deep);opacity:.55}
.ac.ok{opacity:1}.ac b{font-weight:400}.ac.ok b{color:var(--gold)}.ac p{margin:0;font-size:13px}
.ac button{min-height:40px;padding:0 10px;font-size:13px;background:var(--deep)}.ac button.on{background:var(--gold);color:#0f1018}
.lk{font-size:12px;color:var(--slate)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{min-height:48px;background:var(--deep)}.seg button.on{background:var(--leaf);color:#0f1018}
.dang{background:var(--red);min-height:48px;width:100%}
.bulkb{width:100%;min-height:44px;margin:4px 0 6px;background:var(--deep);color:var(--ink)}
.bqs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.bqs button{min-height:44px;background:var(--panel);color:var(--ink);font-size:14px}
.brow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;border-bottom:2px solid var(--deep);padding:4px 0;cursor:pointer}
.brow .ck{width:30px;height:30px;border:3px solid var(--dim);border-radius:6px;display:grid;place-items:center;font-size:18px;color:#0f1018}
.brow.on .ck{background:var(--org);border-color:var(--org)}.brow.on .eqc{outline:2px solid var(--org)}
.bfoot{position:sticky;bottom:0;background:var(--bg);padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-top:2px solid var(--deep)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-20px);background:var(--gold);color:#0f1018;border:3px solid #0f1018;border-radius:6px;padding:8px 16px;font-size:15px;z-index:20;opacity:0;pointer-events:none;white-space:nowrap}
#toast.on{animation:tst 2.6s}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-20px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
.mapfab{position:absolute;top:10px;right:10px;min-width:52px;min-height:44px;background:#262b44e6;font-size:14px}
#stairBtn{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--gold);color:#0f1018;padding:8px 18px;min-height:48px;font-size:17px}
#stairBtn:active{transform:translate(-50%,2px)}
.ctrl{position:relative;background:var(--panel);border-top:3px solid #0f1018}
#log{height:64px;margin:8px 10px 0;padding:5px 10px;background:#0f1018;border-radius:6px;font-size:14px;line-height:1.4;overflow:hidden}
#log div{color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log div:first-child{color:var(--ink)}
.pad{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:12px 14px 14px;touch-action:none}
.dpad{order:2;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:3px}
.dpad button{background:var(--slate);font-size:18px;color:var(--ink)}
.dpad .w{background:var(--deep);font-size:13px;color:var(--dim)}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto 1fr auto;gap:6px}
.acts button{min-height:44px;font-size:15px}
.acts .sk{background:var(--blue)}
.acts .it{background:var(--gold);color:#0f1018}
.acts .atk{grid-column:1/-1;font-size:24px;background:var(--red);min-height:64px}
.acts .tg{grid-column:1/-1;background:var(--deep);font-size:14px;min-height:40px}
.acts .tg[aria-pressed=true]{background:var(--gold);color:#0f1018}
.sheet{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;z-index:3}
.sheet[hidden]{display:none}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 6px}
.sh b{font-weight:400;font-size:19px}.sh small{color:var(--dim);font-size:13px;margin-left:8px}
.sh button{min-height:44px;min-width:76px;background:var(--deep)}
.sl{flex:1;overflow-y:auto;margin:0 10px 10px;background:#0f1018;border-radius:6px;padding:0 10px}
.si{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:2px solid var(--deep)}
.si:last-child{border-bottom:0}
.si b{font-weight:400;font-size:16px}.si b em{font-style:normal;color:var(--sky);font-size:13px;margin-left:8px}.si b em.n{color:var(--gold)}
.si p{margin:0;color:var(--dim);font-size:13px;line-height:1.35}
.si button{min-height:44px;min-width:72px;background:var(--leaf);color:#0f1018}
.si.empty{color:var(--slate);font-size:14px}
/* モーダル */
#modal{position:fixed;inset:0;background:#0f1018b3;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#modal.on{display:flex}
.box{background:var(--panel);border:3px solid #0f1018;border-radius:8px;padding:18px;width:100%;max-width:400px;max-height:84vh;overflow-y:auto;box-shadow:0 6px 0 #0f1018}
.box h3{margin:0 0 8px;font-size:22px;font-weight:400;color:var(--lime)}
.box p{margin:6px 0;color:var(--dim)}
.box table{width:100%;border-collapse:collapse;font-size:15px}
.box td{padding:7px 0;border-bottom:2px solid var(--deep)}
.box td:last-child{text-align:right;white-space:nowrap}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btns button{flex:1;min-height:48px;background:var(--deep);font-size:16px}
.btns .pri{background:var(--leaf);color:#0f1018}

function mkEq(id){const d=EQ[id],[a,b]=RAR[d.r].k,n=a+rnd(b-a+1),rolls=[];
 while(rolls.length<n){const key=chance(.8)?pick(AFF[d.t]):pick(Object.keys(ABI));if(rolls.some(r=>r[0]===key))continue;const [lo,hi]=ABI[key].r;rolls.push([key,lo+rnd(hi-lo+1)])}
 return {id,uid:uidc++,star:1,plus:0,rolls}}

function load(){let s=null;try{s=JSON.parse(localStorage.getItem('dungeon_rpg_v3'))}catch(e){}
 s=Object.assign(structuredClone(DEF),s||{});s.stats=Object.assign(structuredClone(DEF.stats),s.stats);s.pts=Object.assign(structuredClone(DEF.pts),s.pts);s.opt=Object.assign(structuredClone(DEF.opt),s.opt);
 if(!s.eq)s.eq={w:mkEq('w_novice'),a:mkEq('a_cloth')};
 // ここに将来のデータ移行を追加する（s.ver が古い場合に変換）
for(const L of [s.inv||[],s.store||[]])for(const x of L)if(x.id==='escape')x.id='sight';if(s.itBook&&s.itBook.escape){delete s.itBook.escape;s.itBook.sight=1}s.eqBook.w_novice=s.eqBook.a_cloth=1;return s}
function persist(){checkAch();save.ver=SAVE_VER;try{localStorage.setItem('dungeon_rpg_v3',JSON.stringify(save))}catch(e){}}
const need=lv=>Math.round(12*lv**1.4);
const eqVal=i=>Math.round(EQ[i.id].v*(1+.5*(i.star-1)))+i.plus;
function abil(k){let s=0;for(const i of [save.eq.w,save.eq.a]){const u=EQ[i.id].u;if(u&&u[k])s+=u[k];for(const [a,v] of i.rolls)if(a===k)s+=v}return s}
function calc(){const p=save.pts;return {mhp:60+p.hp*5+abil('mhp'),mmp:10+p.mp*2+abil('mmp'),atk:8+p.atk+eqVal(save.eq.w),def:3+p.def+eqVal(save.eq.a),luck:p.luck}}
function recalc(){applyChar();if(!P)return;const c=calc(),dh=c.mhp-P.mhp;Object.assign(P,c);P.atk+=P.buff;P.def+=P.dbuff||0;if(dh>0)P.hp+=dh;P.hp=Math.min(P.hp,P.mhp);P.mp=Math.min(P.mp,P.mmp);hud()}

function makeTiles(T){
 const sp=(p,c,n)=>{for(let i=0;i<n;i++)p(c,rnd(16),rnd(16))};
 const grid=p=>{p(T.fl[1],0,0,16,1);p(T.fl[1],0,0,1,8);p(T.fl[1],0,8,16,1);p(T.fl[1],8,8,1,8);p(T.fl[2],1,1,6,1);p(T.fl[2],9,1,6,1);p(T.fl[2],1,9,6,1);p(T.fl[2],9,9,6,1)};
 const fb=(p,v=0)=>{p(T.fl[0],0,0,16,16);sp(p,T.fl[1],T.grid?6:18);sp(p,T.fl[2],T.grid?4:9);if(T.grid)grid(p);
  if(T.gold){p(T.fl[3],0,0,2,1);p(T.fl[3],0,0,1,2);p(T.fl[3],8,8,2,1);p(T.fl[3],8,8,1,2)}
  if(v===1){if(T.crack){p(T.fl[3],3,4,1,3);p(T.fl[3],4,7,1,2);p(T.dc[0],5,9,1,1);p(T.fl[3],5,9,3,1)}else{p(T.fl[3],2,10,3,1);p(T.fl[3],3,11,4,1)}}
  if(v===2){const a=rnd(10)+2,b=rnd(10)+2;p(T.dc[rnd(3)],a,b);p(T.dc[rnd(3)],a+3,b+2);p(T.fl[2],a+1,b+1)}
  if(v===3){if(T.gold){p(T.dc[1],5,4,6,1);p(T.dc[1],7,3,2,3);p(T.dc[2],7,4,2,1)}else{p(T.fl[3],4,5,5,2);p(T.fl[3],5,7,4,1);p(T.fl[1],5,5,2,1)}}};
 const front=v=>tileCanvas(p=>{
  if(T.wall==='hedge'){p(T.wl[0],0,0,16,16);for(let i=0;i<46;i++){const x=rnd(15),y=3+rnd(12);p(T.wl[1],x,y,2,2)}for(let i=0;i<18;i++)p(T.wl[2],rnd(16),3+rnd(12));p(T.wl[0],0,15,16,1);
   p(T.cp[0],0,0,16,4);for(let i=0;i<10;i++)p(T.cp[1],rnd(15),rnd(3),2,1);p(T.cp[2],v?3:11,1);p(T.cp[2],v?12:5,0);if(v){p(T.dc[0],6,8);p(T.dc[1],11,11)}}
  else{p(T.wl[0],0,0,16,16);for(let r=0;r<3;r++){const o=r%2?4:0;for(let i=-1;i<3;i++){const x=i*8+o;p(T.wl[1],x+1,5+r*4,6,3);p(T.wl[2],x+1,5+r*4,6,1)}}
   if(v){p(T.wl[0],5,6,1,3);p(T.wl[0],6,9,1,2);p(T.wl[0],11,10,2,1)}
   p(T.cp[0],0,3,16,2);p(T.cp[1],0,0,16,3);p(T.cp[2],v?3:10,0,2,1);p(T.cp[2],v?11:2,1);p(T.cp[1],v?6:12,3,2,2)}});

function decorate(){
 G.deco=new Array(W*H).fill(null);G.wd=new Array(W*H).fill(null);
 const wall=(x,y)=>x<0||y<0||x>=W||y>=H||G.m[y][x]===1;
 const keys=Object.keys(TH.props),wsum=keys.reduce((a,k)=>a+TH.props[k],0);
 for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
  const i=x+y*W;
  if(G.m[y][x]===1){if(y+1<H&&G.m[y+1][x]===0&&G.roomAt[x+(y+1)*W]>=0&&chance(.3))G.wd[i]=wpick(TH.wd);continue}
  if(G.roomAt[i]<0||(x===G.st.x&&y===G.st.y)||(x===P.x&&y===P.y)||(G.hz&&G.hz[i]))continue;
  const nearWall=D4.some(([dx,dy])=>wall(x+dx,y+dy));
  if(!chance(nearWall?.3:.08))continue;
  let k=wpick(TH.props);if(TALL[k]&&!nearWall)continue;
  // 入口（通路の出入り口）はふさがない
  if(D4.some(([dx,dy])=>G.m[y+dy][x+dx]===0&&G.roomAt[x+dx+(y+dy)*W]<0))continue;
  G.deco[i]=k}
}

 for(const q of PARTS){q.x+=T.vx*(.6+.8*((q.ph*7)%1))+Math.sin(q.ph+performance.now()/900)*.15;q.y+=T.vy+Math.cos(q.ph+performance.now()/1100)*.1;
  if(q.x<-10)q.x=cw+5;if(q.x>cw+10)q.x=-5;if(q.y<-10)q.y=ch+5;if(q.y>ch+10)q.y=-5}}

function openSynth(main,mat){

function genMap(){
 for(;;){
  const m=Array.from({length:H},()=>new Uint8Array(W).fill(1)),rooms=[],target=8+rnd(5);
  for(let a=0;a<600&&rooms.length<target;a++){
   const w=5+rnd(5),h=4+rnd(4),x=1+rnd(W-w-2),y=2+rnd(H-h-3);
   if(rooms.some(r=>x<r.x+r.w+2&&x+w+2>r.x&&y<r.y+r.h+2&&y+h+2>r.y))continue;
   rooms.push({x,y,w,h});
  }
  if(rooms.length<8)continue;
  for(const r of rooms)for(let j=r.y;j<r.y+r.h;j++)for(let i=r.x;i<r.x+r.w;i++)m[j][i]=0;
  const c=r=>[r.x+(r.w>>1),r.y+(r.h>>1)],ds=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);
  const tree=[0],edges=[];
  while(tree.length<rooms.length){let best=null;
   for(const a of tree)for(let b=0;b<rooms.length;b++){if(tree.includes(b))continue;const d=ds(c(rooms[a]),c(rooms[b]));if(!best||d<best[2])best=[a,b,d]}
   tree.push(best[1]);edges.push(best)}
  for(let k=0,n=2+rnd(2);k<n;k++){const a=rnd(rooms.length),b=rnd(rooms.length);if(a!==b)edges.push([a,b])}
  for(const [a,b] of edges){let [x,y]=c(rooms[a]);const [tx,ty]=c(rooms[b]);
   const hx=()=>{while(x!==tx){x+=Math.sign(tx-x);m[y][x]=0}},vy=()=>{while(y!==ty){y+=Math.sign(ty-y);m[y][x]=0}};
   Math.random()<.5?(hx(),vy()):(vy(),hx())}
  const roomAt=new Int8Array(W*H).fill(-1);
  rooms.forEach((r,i)=>{for(let j=r.y;j<r.y+r.h;j++)for(let k=r.x;k<r.x+r.w;k++)roomAt[k+j*W]=i});
  return {m,rooms,roomAt};
 }
}

 const d=dm[e.x+e.y*W];if(opts.length&&d>=0){const vals=opts.map(([x,y])=>dm[x+y*W]);const b=Math.min(...vals.filter(v=>v>=0));if(b<d)moveE(e,opts[vals.indexOf(b)])}

function enemiesAct(t){
 const dm=bfs(P.x,P.y);
 const one=(e,second)=>{

  if(D.boss){if(!second&&tickSt(e)&&e.hp<=0){kill(e);return 0}bossAct(e,t,dm);if(P.hp<=0)return 1;return 0}
  if(!second&&tickSt(e)&&e.hp<=0){kill(e);return 0}
  if(e.st.sleep||e.st.para)return 0;
  if(D.slow&&G.turn%2)return 0;
  if(D.healer){e.hcd=(e.hcd||0)-1;const hurt=G.en.filter(o=>o!==e&&!EN[o.type].boss&&o.hp<o.mhp*.7&&Math.max(Math.abs(o.x-e.x),Math.abs(o.y-e.y))<=4).sort((a,b)=>a.hp/a.mhp-b.hp/b.mhp)[0];
   if(hurt&&e.hcd<=0){const hv=Math.ceil(hurt.mhp*.3);hurt.hp=Math.min(hurt.mhp,hurt.hp+hv);e.hcd=3;fx(hurt.x,hurt.y,'+'+hv,'#a7f070');shot(e.x,e.y,hurt.x,hurt.y,'#a7f070');if(G.vis[e.x+e.y*W])say(`${ename(e)}が${ename(hurt)}を癒やした！`);return 0}}
  const md=Math.abs(e.x-P.x)+Math.abs(e.y-P.y),d=dm[e.x+e.y*W];
  if(second&&md<=1)return 0;
  if(!e.aware&&(G.vis[e.x+e.y*W]||(d>=0&&d<=5)))e.aware=true;
  const opts=D4.map(([dx,dy])=>[e.x+dx,e.y+dy]).filter(([x,y])=>walk(x,y)&&!enemyAt(x,y)&&!(x===P.x&&y===P.y));
  const melee=()=>{e.dir=dirOf(P.x-e.x,P.y-e.y);hitPlayer(e,t)};
  if(e.st.conf&&chance(.5)){if(!e.st.frz&&opts.length)moveE(e,pick(opts));return 0}
  if(e.type==='mush'&&Math.abs(e.x-P.x)<=1&&Math.abs(e.y-P.y)<=1&&G.turn%4===0){say('キノコが胞子をまいた！');se('spore');(G.sp=G.sp||[]).push({x:e.x,y:e.y,t0:performance.now()});fx(e.x,e.y,'胞子！','#d77bea');e.lunge=performance.now();if(chance(.5))applySt(P,'poison');G.interrupt=true;return 0}
  if(D.charge&&e.aware){
   if(e.ready){e.ready=false;
    if(md>1&&lineClear(e,D.charge+1)){const dx=Math.sign(P.x-e.x),dy=Math.sign(P.y-e.y);while(Math.abs(P.x-e.x)+Math.abs(P.y-e.y)>1){e.x+=dx;e.y+=dy}
     e.dir=dirOf(dx,dy);say(`${ename(e)}の突進！`);hitPlayer(e,t,1.5);if(P.hp<=0)return 1;return 0}}
   else if(md>1&&!e.st.frz&&lineClear(e,D.charge)){e.ready=true;e.dir=dirOf(Math.sign(P.x-e.x),Math.sign(P.y-e.y));say(`${ename(e)}が身構えた！`);G.interrupt=true;return 0}
  }
  if(e.rc>0)e.rc--;
  if(D.ranged&&e.aware&&md>1&&!(e.rc>0)&&lineClear(e,D.ranged)){e.rc=D.rcd||(isAby()?2:0);e.dir=dirOf(Math.sign(P.x-e.x),Math.sign(P.y-e.y));shot(e.x,e.y,P.x,P.y,D.shotC||'#ffcd75');hitPlayer(e,t,1,true);if(P.hp<=0)return 1;return 0}
  if(md===1&&!e.flee){melee();if(P.hp<=0)return 1;return 0}
  if(e.st.frz||D.still)return 0;
  if(e.flee&&G.turn%2)return 0;
  let tgt=null;
  if(opts.length){
   const vals=opts.map(([x,y])=>dm[x+y*W]);
   if(D.erratic&&chance(D.erratic))tgt=pick(opts);
   else if(e.aware&&d>=0){
    if(e.flee||(D.ranged&&md<=2&&!D.nokite)){const b=Math.max(...vals);if(b>d)tgt=pick(opts.filter((_,i)=>vals[i]===b))}
    else{const b=Math.min(...vals);if(b>=0&&b<d)tgt=pick(opts.filter((_,i)=>vals[i]===b))}}
   else if(chance(.5))tgt=pick(opts);
  }
  if(tgt)moveE(e,tgt);
  else if(md===1){melee();if(P.hp<=0)return}
 };
 for(const e of [...G.en]){

function act(type,dir){
 if(busy())return;
 const t=performance.now();
 if(type==='move'){
  if(turnMode){P.dir=dir;setTurnMode(false);return}
  if(P.st.conf&&chance(.5)){dir=pick(Object.keys(DIRS));say('混乱してふらついた。')}
  P.dir=dir;const [dx,dy]=DIRS[dir],nx=P.x+dx,ny=P.y+dy;
  const e=enemyAt(nx,ny);if(e){strike(e,t);return endTurn()}
  const c=chestAt(nx,ny);if(c){return openChest(c)}
  if(!pass(nx,ny)){if(P.st.conf)endTurn();return}
  if(P.st.frz){say('凍りついて動けない！');return endTurn()}
  P.ox=P.x;P.oy=P.y;P.mt=performance.now();P.step=(P.step||0)+1;P.x=nx;P.y=ny;P.mp=Math.min(P.mmp,P.mp+1);
  if(nx===G.st.x&&ny===G.st.y){say('階段を見つけた。');G.interrupt=true}
  const tr=at(G.traps,nx,ny);if(tr)trigger(tr);stepHaz();
  endTurn();
  if(G.over)return;
  const sp=at(G.springs,P.x,P.y);if(sp&&!sp.used){sp.used=true;heal(P.mhp);P.mp=P.mmp;hud();say('回復の泉だ。HPとMPが全回復した！')}
  const it=itemAt(P.x,P.y);if(it)pickup(it);
  const ev=at(G.events,P.x,P.y);if(ev&&!it)runEvent(ev);
  return;
 }
 if(type==='attack'){if(P.st.conf&&chance(.5)){P.dir=pick(Object.keys(DIRS));say('混乱して違う方向を斬った。')}
  const [dx,dy]=DIRS[P.dir],e=enemyAt(P.x+dx,P.y+dy);P.swing=t;P.lunge=t;
  if(e)strike(e,t);else{const c=chestAt(P.x+dx,P.y+dy);if(c)return openChest(c);say('空を斬った。')}return endTurn()}
 if(type==='wait'){const it=itemAt(P.x,P.y);endTurn();if(it&&!G.over)pickup(it);return}
}

 if(P.mp<s.mp){say('MPが足りない。');return}
 let dest=null;
 if(id==='warp'){for(let i=1;i<=3;i++){const x=P.x+dx*i,y=P.y+dy*i;if(!pass(x,y))break;if(walk(x,y)&&!enemyAt(x,y))dest=[x,y]}if(!dest){say('移動できる場所がない。');return}}

 if(id==='spin'){P.spin=t;const hit=G.en.filter(e=>Math.abs(e.x-P.x)<=1&&Math.abs(e.y-P.y)<=1);if(!hit.length)say('周りに敵はいない。');hit.forEach(e=>G.en.includes(e)&&strike(e,t,.8,false))}

  for(let i=1;i<=3;i++){const x=P.x+dx*i,y=P.y+dy*i;if(!walk(x,y))break;const e=enemyAt(x,y);if(e){strike(e,t,1,false);n++}}if(!n)say('正面に敵はいない。')}
